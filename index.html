  if(G.bossHp<=0)killBoss(b);
}
function killBoss(b){
  G.words.forEach(w=>{const p=wx(w);boom(p.x,w.y,'#8f7bff',8)});G.words=[];G.shots=[];G.rev=[];
  boom(b.x,b.y,'#ffd24a',40);
  G.score+=500*G.lvl;G.lvl++;G.lives=Math.min(G.maxL,G.lives+1);initBoss();qAdd('boss',1);
  const rw=payout();SFX.bossDie();bossBuzz();showPerks(rw);
}
function hitBoss(s){
  const n=s.len,pk=G.pk;let m=(1+Math.min(G.combo,10)*.05)*(1+.15*(pk.dmg||0));
  if(n>=7)m*=1+.4*(pk.long||0);if(PR.eq.p==='p3')m*=1.1;
  let dmg=n*n/2*m;if(bt()===2&&n<5){dmg*=.4;bmsg('🛡')}
  dmg=Math.round(dmg);G.combo++;qMax('combo',G.combo);
  G.score+=dmg*10*Math.max(1,Math.floor(G.combo/(pk.combo?2:3)));
  hap(n>=7?'heavy':'medium');SFX.hit(n);hurt(dmg);
}
function applySpecial(w,x,y){
  const k=w.k;qAdd('special',1);
  if(k==='gold'){const g=2+G.lvl;G.gb+=g;pop(x,y-14,'+'+g+' 🪙','#ffd24a');SFX.coin()}
  else if(k==='ice'){G.freeze=3.5;pop(x,y-14,'❄','#7fe8ff')}
  else if(k==='heart'){G.lives=Math.min(G.maxL,G.lives+1);pop(x,y-14,'+❤','#ff6a8a')}
  else if(k==='fire'){let tot=0;for(const o of G.words){if(o.locked||o===w)continue;const p=wx(o);boom(p.x,o.y,'#ff7a2a',12);if(o.k!=='dark')tot+=Math.round(o.t.length*o.t.length/3);o.dead=true}G.words=G.words.filter(o=>!o.dead);G.score+=tot*5;if(tot)hurt(tot,'#ff7a2a')}
}
function useAb(id){
  const a=AB.find(x=>x.id===id);if(!a||!PR.own.includes(id)||st!=='play'||G.banner>0)return;
  if(G.mana<a.cost){SFX.err();hap('rigid');return}
  G.mana-=a.cost;qAdd('abil',1);SFX.ab();hap('heavy');
  if(a.key==='freeze'){G.freeze=4;pop(W/2,H*.35,'❄','#7fe8ff')}
  else if(a.key==='shield'){G.shield++;pop(W/2,H*.55,'🛡','#7fd0ff')}
  else if(a.key==='heal'){G.lives=Math.min(G.maxL,G.lives+1);pop(W/2,H*.55,'+❤','#ff6a8a')}
  else{let tot=0;for(const o of G.words){if(o.locked)continue;const p=wx(o);boom(p.x,o.y,'#ffd24a',14);if(o.k!=='dark')tot+=Math.round(o.t.length*o.t.length/2);o.dead=true}G.words=G.words.filter(o=>!o.dead);G.score+=tot*5;hurt(tot+G.bossMax*.1,'#ffd24a')}
}
function update(dt){
  G.t+=dt;G.flash=Math.max(0,G.flash-dt);G.shake=Math.max(0,G.shake-dt);G.freeze=Math.max(0,G.freeze-dt);G.burn=Math.max(0,G.burn-dt);
  if(G.banner>0)G.banner-=dt;
  else{
    G.spawn-=dt;
    if(G.spawn<=0){if(G.burst>0){spawnWord(true);G.burst--;G.spawn=.45}else{spawnWord();G.spawn=Math.max(.9,2.5-G.lvl*.18)+RNG()*.5}}
    G.mt-=dt;
    if(G.mt<=0){const k=bt();if(k===0){G.burst=3;G.mt=10;bmsg(TX[lang].raid)}else if(k===4){G.burn=3;G.mt=12;bmsg(TX[lang].breath)}else G.mt=99}
    for(const r of G.rev)r.d-=dt;
    const due=G.rev.filter(r=>r.d<=0);G.rev=G.rev.filter(r=>r.d>0);due.forEach(r=>spawnWord(false,r.t,null,true));
  }
  const o=L(),mv=G.freeze>0?0:(G.burn>0?1.7:1);
  for(const w of G.words){
    if(w.locked)continue;
    w.y+=w.sp*dt*mv;
    if(w.y>o.limit){
      w.dead=true;const p=wx(w);
      if(w.k==='dark')boom(p.x,o.limit,'#b06aff',10);
      else{boom(p.x,o.limit,'#ff5a6e',14);loseLife();if(bt()===5){G.bossHp=Math.min(G.bossMax,G.bossHp+Math.round(G.bossMax*.05));const b=bossPos();pop(b.x,b.y-20,'+HP','#ff6ad5')}}
      if(G.target===w){G.target=null;G.typed=''}
    }
  }
  G.words=G.words.filter(w=>!w.dead);
  for(const s of G.shots){
    if(st!=='play')break;
    let tx,ty;
    if(s.stage===1){const p=wx(s.w);tx=p.x;ty=s.w.y}else{const b=bossPos();tx=b.x;ty=b.y}
    const dx=tx-s.x,dy=ty-s.y,d=Math.hypot(dx,dy),sp=(s.stage===1?1100:900)*dt;
    if(d<=sp+8){
      if(s.stage===1){
        const w=s.w;SFX.word(s.len);boom(tx,ty,w.k?SPEC[w.k].c:'#ffd24a',12+s.len*2);G.words=G.words.filter(x=>x!==w);
        if(w.k==='dark'){s.done=true;loseLife();G.combo=0;pop(tx,ty-14,'💀','#b06aff')}
        else{
          qAdd('words',1);if(w.t.length>=8)qAdd('long',1);
          G.mana=Math.min(100,G.mana+s.len*4*(1+.4*(G.pk.mana||0)));
          if(bt()===1&&!w.rv&&RNG()<.3){G.rev.push({t:w.t,d:1.6});pop(tx,ty-14,'☠','#cfe0ff')}
          s.stage=2;if(w.k)applySpecial(w,tx,ty);
        }
      }else{s.done=true;hitBoss(s)}
    }else{s.x+=dx/d*sp;s.y+=dy/d*sp}
    G.parts.push({x:s.x,y:s.y,vx:0,vy:0,life:.25,max:.25,col:s.stage===1?'#8f7bff':item('s').orb,r:2+s.len*.4});
  }
  G.shots=G.shots.filter(s=>!s.done);G.words=G.words.filter(w=>!w.dead);
  for(const p of G.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
  G.parts=G.parts.filter(p=>p.life>0);
  if(G.lives<=0&&st==='play')gameOver();
}

const QD=[{id:'boss',need:2,g:30,ru:'Победи 2 босса',en:'Defeat 2 bosses'},{id:'words',need:40,g:20,ru:'Скасти 40 слов',en:'Cast 40 words'},{id:'long',need:5,g:30,ru:'Скасти 5 слов от 8 букв',en:'Cast 5 words of 8+ letters'},{id:'score',need:8000,g:30,ru:'Набери 8000 очков за забег',en:'Score 8000 in one run'},{id:'special',need:4,g:25,ru:'Скасти 4 особых слова',en:'Cast 4 special words'},{id:'abil',need:3,g:25,ru:'Используй способности 3 раза',en:'Use abilities 3 times'},{id:'combo',need:12,g:25,ru:'Серия из 12 слов',en:'Reach a 12-word streak'},{id:'daily',need:1,g:40,ru:'Пройди забег дня',en:'Play the daily run'}];
const QM=Object.fromEntries(QD.map(q=>[q.id,q]));
function ensureDay(){
  const d=dayKey();if(PR.dq&&PR.dq.d===d)return;
  const r=mb(seedOf(d+'q')),pool=QD.filter(q=>q.id!=='abil'||PR.own.some(i=>i[0]==='a')),pk=[];
  while(pk.length<3&&pool.length)pk.push(pool.splice(Math.floor(r()*pool.length),1)[0]);
  PR.dq={d,q:pk.map(q=>({id:q.id,h:0,c:0}))};
  const y=new Date(Date.now()-864e5);PR.st=PR.ld===dKey(y)?(PR.st||0)+1:1;PR.ld=d;
  const g=Math.min(7,PR.st)*8;PR.gold+=g;PR.lg=g;saveP();
}
function qAdd(id,n){const q=PR.dq&&PR.dq.q.find(x=>x.id===id);if(q&&!q.c){q.h=Math.min(QM[id].need,q.h+n);saveP()}}
function qMax(id,v){const q=PR.dq&&PR.dq.q.find(x=>x.id===id);if(q&&!q.c){q.h=Math.max(q.h,Math.min(QM[id].need,v));saveP()}}
function share(text){
  const url=SHARE_URL||location.href.split('#')[0];
  try{if(tg&&tg.openTelegramLink){tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(text));return}}catch(e){}
  try{if(navigator.share){navigator.share({text,url});return}}catch(e){}
  try{navigator.clipboard.writeText(text+' '+url)}catch(e){}
}

  c.save();c.translate(-36,-30+Math.sin(t*3)*2);const fl=Math.sin(t*9)*3,eyes=(x,y,r)=>{c.fillStyle='#fff';c.beginPath();c.arc(-x,y,r,0,6.283);c.arc(x,y,r,0,6.283);c.fill();c.fillStyle='#111';c.beginPath();c.arc(-x,y,r*.45,0,6.283);c.arc(x,y,r*.45,0,6.283);c.fill()};
  if(id==='p1'){c.fillStyle='#6f5238';c.beginPath();c.ellipse(-9,2+fl,3,7,0,0,6.283);c.ellipse(9,2+fl,3,7,0,0,6.283);c.fill();c.fillStyle='#8a6a4a';c.beginPath();c.ellipse(0,0,8,10,0,0,6.283);c.fill();c.fillStyle='#c9a77a';c.beginPath();c.ellipse(0,3,5,6,0,0,6.283);c.fill();eyes(3,-4,3);c.fillStyle='#ffb347';c.beginPath();c.moveTo(-1.5,-1);c.lineTo(1.5,-1);c.lineTo(0,2.5);c.fill()}
  else if(id==='p2'){c.fillStyle='#e8903a';c.beginPath();c.ellipse(0,4,8,7,0,0,6.283);c.fill();c.beginPath();c.arc(0,-5,7,0,6.283);c.fill();c.beginPath();c.moveTo(-7,-8);c.lineTo(-4,-14);c.lineTo(-1,-9);c.moveTo(7,-8);c.lineTo(4,-14);c.lineTo(1,-9);c.fill();c.strokeStyle='#e8903a';c.lineWidth=3;c.beginPath();c.moveTo(8,6);c.quadraticCurveTo(15,2,12,-6+fl);c.stroke();eyes(3,-5,2.2)}
  else if(id==='p3'){c.fillStyle='#3a9a55';c.beginPath();c.moveTo(-5,0);c.lineTo(-15,-8+fl);c.lineTo(-9,3);c.moveTo(5,0);c.lineTo(15,-8+fl);c.lineTo(9,3);c.fill();c.beginPath();c.ellipse(0,2,8,8,0,0,6.283);c.fill();c.beginPath();c.arc(0,-6,6,0,6.283);c.fill();c.fillStyle='#e8d9a8';c.beginPath();c.moveTo(-4,-10);c.lineTo(-3,-15);c.lineTo(-1,-10);c.moveTo(4,-10);c.lineTo(3,-15);c.lineTo(1,-10);c.fill();eyes(2.6,-6,2);c.fillStyle='#ffb347';c.beginPath();c.arc(0,-1,2+Math.abs(fl)*.3,0,6.283);c.fill()}
  c.restore();

function showShop(part,back){
  const t=TX[lang],nm={h:t.hat,c:t.cloak,s:t.staff,t:t.trail,k:t.kbd,p:t.pet,a:t.abil};
  const sw=i=>part==='t'?`<i class="sq" style="background:${i.mode==='rb'?'linear-gradient(90deg,red,yellow,lime,cyan,magenta)':i.mode==='bolt'?'linear-gradient(90deg,#4a7fff,#fff)':`linear-gradient(90deg,hsl(${i.th[0]},90%,60%),hsl(${i.th[1]},90%,65%))`}"></i>`:part==='k'?`<i class="sq" style="background:rgb(${i.f});border-color:rgb(${i.bd})"></i>`:'';
  ov.innerHTML=`<h1>${t.wd}</h1><canvas id="pv" style="width:110px;height:130px"></canvas><div class="sm">🪙 ${PR.gold}</div><div class="tabs">${Object.keys(nm).map(k=>`<button class="tab ${k===part?'on':''}" data-k="${k}">${ICON[k]}${k===part?' '+nm[k]:''}</button>`).join('')}</div><div class="list">${SK[part].map(i=>{const own=PR.own.includes(i.id),eq=part==='a'?own:PR.eq[part]===i.id;return `<div class="it ${eq?'eq':''} ${!own&&PR.gold<i.p?'no':''}" data-id="${i.id}"><span>${sw(i)}${i.ic?i.ic+' ':''}${i.n[lang]}${i.d?`<em>${i.d[lang]}</em>`:''}</span><small>${eq?(part==='a'?'✓':t.equip):own?t.wear:'🪙 '+i.p}</small></div>`}).join('')}</div><button id="bk" class="ghost">${t.back}</button>`;
  PVc=$('pv');
  ov.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{SFX.click();showShop(b.dataset.k,back)});
  ov.querySelectorAll('.it').forEach(d=>d.onclick=()=>{
    const i=SK[part].find(x=>x.id===d.dataset.id);
    if(!PR.own.includes(i.id)){if(PR.gold<i.p){hap('rigid');SFX.err();return}PR.gold-=i.p;PR.own.push(i.id)}
    if(part!=='a')PR.eq[part]=i.id;saveP();SFX.click();hap('light');showShop(part,back)});
  $('bk').onclick=()=>{SFX.click();back()};
}
function pause(){
  if(st!=='play')return;
  st='pause';cancelSwipe();showPauseUI();
}
function showPauseUI(){
  const t=TX[lang];
  ov.innerHTML=`<h1>${t.pause}</h1><p>${t.score}: <b>${G.score}</b></p><button id="go">${t.resume}</button><div class="mrow"><button id="st" class="ghost">⚙ ${t.set}</button><button id="mn" class="ghost">${t.menu}</button></div>`;
  PVc=null;ov.classList.remove('hide');
  $('go').onclick=resume;
  $('st').onclick=()=>{SFX.click();showSet(showPauseUI)};
  $('mn').onclick=()=>{SFX.click();const rw=G.score>G.paid?payout():null;G=null;st='menu';showMenu(rw)};
}
function resume(){SFX.click();ov.classList.add('hide');st='play'}
function start(daily){ensureDay();setKb(true);ac();newGame(daily);st='play';ov.classList.add('hide');cancelSwipe();if(daily)qAdd('daily',1)}
buildKb();showMenu();

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function scenery(k){
  const gc=BIO[k].gr;ctx.fillStyle=gc;
  if(k===0){for(let i=0;i<9;i++){const x=(i+.5)*W/9,h=(70+hs(i)*55)*S;ctx.fillRect(x-3*S,H-h*.25,6*S,h*.25);for(let j=0;j<3;j++){const by=H-h*.2-j*h*.26,w=(30-j*8)*S;ctx.beginPath();ctx.moveTo(x-w,by);ctx.lineTo(x,by-h*.42);ctx.lineTo(x+w,by);ctx.fill()}}}
  else if(k===1){ctx.fillStyle='rgba(225,235,255,.9)';ctx.beginPath();ctx.arc(W*.8,H*.42,26*S,0,6.283);ctx.fill();ctx.fillStyle=gc;for(let i=0;i<8;i++){const x=(i+.5)*W/8,h=(24+hs(i)*22)*S;rr(x-11*S,H-h,22*S,h+6,9*S);ctx.fill();if(i%3===0){ctx.fillRect(x-2*S,H-h-18*S,4*S,18*S);ctx.fillRect(x-8*S,H-h-12*S,16*S,4*S)}}}
  else if(k===2){for(let l=0;l<2;l++){ctx.fillStyle=l?gc:'#3b2722';ctx.beginPath();ctx.moveTo(0,H);for(let i=0;i<=8;i++)ctx.lineTo(i*W/8,H-(50+hs(i+l*9)*(90-l*25))*S);ctx.lineTo(W,H);ctx.fill()}}
  else if(k===3){for(let l=0;l<2;l++){ctx.fillStyle=l?gc:'rgba(127,208,255,.22)';for(let i=0;i<9;i++){const x=(i+.5+l*.3)*W/9,h=(45+hs(i+l*7)*95)*S;ctx.beginPath();ctx.moveTo(x-11*S,H);ctx.lineTo(x,H-h);ctx.lineTo(x+11*S,H);ctx.fill()}}}
  else if(k===4){ctx.beginPath();ctx.moveTo(W*.1,H);ctx.lineTo(W*.38,H-120*S);ctx.lineTo(W*.62,H-120*S);ctx.lineTo(W*.9,H);ctx.fill();
    ctx.shadowColor='#ff6a2a';ctx.shadowBlur=24;ctx.fillStyle='#ff7a2a';ctx.beginPath();ctx.ellipse(W/2,H-120*S,W*.12,8*S,0,0,6.283);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='#ff7a2a';ctx.lineWidth=3*S;ctx.beginPath();ctx.moveTo(W*.47,H-118*S);ctx.lineTo(W*.4,H-50*S);ctx.moveTo(W*.54,H-118*S);ctx.lineTo(W*.62,H-40*S);ctx.stroke()}
  else{ctx.strokeStyle='rgba(255,106,213,.28)';ctx.lineWidth=2;const cx=W/2,cy=H*.58,R=Math.min(W,H)*.34,a0=CLK*.25;
    ctx.beginPath();ctx.arc(cx,cy,R,0,6.283);ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,R*.88,0,6.283);ctx.stroke();
    ctx.beginPath();for(let i=0;i<=5;i++){const a=a0+i*4*Math.PI/5;ctx[i?'lineTo':'moveTo'](cx+Math.cos(a)*R*.88,cy+Math.sin(a)*R*.88)}ctx.stroke();
    ctx.fillStyle=gc;ctx.fillRect(0,H-14*S,W,14*S)}
}
function drawBG(k){
  const b=BIO[k],T=CLK,g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,b.sky[0]);g.addColorStop(1,b.sky[1]);ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);
  ctx.fillStyle=b.col;
  for(const s of stars){
    let x=s.u*W,y=s.v*H,a=.35+.35*Math.sin(T*2+s.p),r=s.r;
    if(k===0){x+=Math.sin(T*.7+s.p)*14;y=H*.45+s.v*H*.5+Math.cos(T*.9+s.p)*10;r+=1}
    else if(k===3){y=(s.v*H+T*(20+s.r*18))%H;x+=Math.sin(T+s.p)*8;a=.8;r+=.6}
    else if(k===4){y=H-((s.v*H+T*(25+s.r*25))%H);x+=Math.sin(T*1.5+s.p)*6;a=.8}
    else if(k===2){x=(s.u*W+T*(40+s.r*20))%W;ctx.globalAlpha=.3;ctx.fillRect(x,y,r*8,1);continue}
    ctx.globalAlpha=a;ctx.fillRect(x,y,r,r);
  }
  ctx.globalAlpha=1;scenery(k);
  if(k===1){ctx.fillStyle='rgba(200,215,255,.07)';for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse((T*14+i*W/2.2)%(W*1.4)-W*.2,H-30*S-i*14*S,W*.35,22*S,0,0,6.283);ctx.fill()}}
}
function drawBoss(){
  const o=L(),b=bossPos(),k=(G.lvl-1)%6,r=o.bossR*[1,1,1.12,1,1.1,1][k],F=c=>G.flash>0?'#fff':c;
  const P=(p,c)=>{ctx.fillStyle=c;ctx.beginPath();p.forEach((q,i)=>ctx[i?'lineTo':'moveTo'](q[0]*r,q[1]*r));ctx.fill()};
  const M=(p,c)=>{P(p,c);P(p.map(q=>[-q[0],q[1]]),c)};
  const C=(x,y,d,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x*r,y*r,d*r,0,6.283);ctx.fill()};
  const E=(x,y,a,d,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x*r,y*r,a*r,d*r,0,0,6.283);ctx.fill()};
  const R=(x,y,w,h,c)=>{ctx.fillStyle=c;rr(x*r,y*r,w*r,h*r,.1*r);ctx.fill()};
  ctx.save();ctx.translate(b.x,b.y+Math.sin(G.t*2)*3);
  if(k===0){M([[.6,-.1],[1.5,-.5],[.7,.3]],F('#5fa83a'));C(0,0,1,F('#6fc245'));
    for(const s of[-1,1]){C(.38*s,-.15,.2,'#fff');C(.38*s,-.12,.08,'#111')}
    P([[-.2,.05],[0,.32],[.2,.05]],F('#4d9130'));R(-.5,.38,1,.25,'#1a0d0d');M([[.1,.38],[.2,.56],[.3,.38]],'#fff');
    P([[1.05,.9],[1.4,.8],[1.2,-.4],[.95,-.3]],'#8a5a2b')}
  else if(k===1){C(0,-.1,.95,F('#e8e6dc'));R(-.55,.5,1.1,.5,F('#d8d5c8'));
    for(const s of[-1,1]){C(.4*s,-.1,.27,'#0a0a14');C(.4*s,-.1,.09,'#5cf')}
    P([[-.1,.2],[.1,.2],[0,.02]],'#0a0a14');
    ctx.fillStyle='#0a0a14';for(let i=-2;i<=2;i++)ctx.fillRect((i*.2-.015)*r,.5*r,.03*r,.45*r);
    P([[-.5,-.85],[-.3,-1.3],[-.1,-.95],[0,-1.4],[.1,-.95],[.3,-1.3],[.5,-.85]],F('#6a6fb0'))}
  else if(k===2){E(0,0,1.3,.95,F('#8c8a5c'));M([[.15,-.15],[.95,-.5],[.95,-.3],[.15,0]],'#2e2e1a');
    for(const s of[-1,1])C(.5*s,-.1,.13,'#ff4040');
    C(0,.15,.25,F('#7a7850'));R(-.6,.4,1.2,.3,'#1a0d0d');M([[.35,.4],[.5,.4],[.45,-.05]],'#fffbe8');
    M([[.7,-.75],[.95,-1.2],[1.05,-.7]],F('#6a6a44'))}
  else if(k===3){P([[-1.2,1.1],[-.85,-.8],[0,-1.2],[.85,-.8],[1.2,1.1]],F('#3b3f8c'));C(0,0,.62,'#05050f');
    for(const s of[-1,1])E(.25*s,-.05,.14,.1,'#6ff');
    P([[-.5,-.95],[-.4,-1.45],[-.22,-1.05],[0,-1.55],[.22,-1.05],[.4,-1.45],[.5,-.95]],F('#ffd24a'));
    for(let i=0;i<2;i++){const a=G.t*2+i*Math.PI;C(Math.cos(a)*1.6,Math.sin(a)*.4+.2,.17,'#7fe8ff')}}
  else if(k===4){M([[.8,-.2],[2,-1],[1.6,.4],[1.2,.1],[.9,.5]],F('#8a2a1e'));C(0,0,1,F('#c23a2a'));
    M([[.6,-.6],[1.1,-1.5],[.2,-.85]],'#f0e0c0');E(0,.42,.6,.42,F('#d9503a'));
    for(const s of[-1,1]){C(.2*s,.4,.07,'#400');E(.5*s,-.2,.2,.14,'#ffd24a');ctx.fillStyle='#000';ctx.fillRect((.5*s-.02)*r,-.33*r,.04*r,.26*r)}
    P([[-.18,-.98],[0,-1.35],[.18,-.98]],F('#8a2a1e'))}
  else{M([[.8,-.4],[1.3,-1.1],[1.1,-1.4],[.3,-.8]],'#e9d8ff');C(0,0,1,F('#9a2a8a'));
    for(let i=-2;i<=2;i++){const h=1.2+.25*Math.sin(G.t*8+i*2);P([[i*.28-.14,-.9],[i*.28,-h-.2],[i*.28+.14,-.9]],'#ff8a2a')}
    for(const s of[-1,1]){E(.4*s,-.1,.24,.14,'#ffe27a');C(.4*s,-.1,.06,'#300')}
    R(-.5,.3,1,.3,'#1a0d2e');for(let i=-2;i<=2;i++)P([[i*.18-.07,.3],[i*.18+.07,.3],[i*.18,.45]],'#fff')}
  ctx.restore();
}
function drawMage(){figure(ctx,W/2,H-8,S,G&&G.target,G?G.t:0)}
function drawWord(w){
  const p=wx(w),o=L(),h=fs()+14,x=p.x-p.tw/2,y=w.y-h/2,sp=w.k?SPEC[w.k]:null;
  const danger=w.y>o.limit-70*S&&w.k!=='dark',isT=G.target===w;
  ctx.fillStyle=w.k==='dark'?'rgba(40,14,52,.95)':'rgba(29,24,69,.94)';rr(x,y,p.tw,h,9);ctx.fill();
  ctx.lineWidth=isT?3:2;ctx.strokeStyle=isT?'#ffd24a':danger?'#ff5a6e':G.freeze>0?'#7fe8ff':G.burn>0?'#ff7a2a':sp?sp.c:'#6a58e0';ctx.stroke();
  ctx.font=`700 ${fs()}px ui-monospace,Menlo,Consolas,monospace`;ctx.textBaseline='middle';ctx.textAlign='left';
  const n=isT?G.typed.length:0,a=w.t.slice(0,n),b=w.t.slice(n),tx=x+12+(w.k?22:0);
  if(bt()===3&&!isT)ctx.globalAlpha=.3+.7*Math.abs(Math.sin(G.t*1.6+w.u*7));
  ctx.fillStyle='#ffd24a';ctx.fillText(a,tx,w.y+1);ctx.fillStyle='#f4f0ff';ctx.fillText(b,tx+ctx.measureText(a).width,w.y+1);ctx.globalAlpha=1;
  if(sp){ctx.font='16px system-ui,sans-serif';ctx.fillText(sp.ic,x+8,w.y+1)}
}
function draw(){
  ctx.save();
  if(G&&G.shake>0)ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  drawBG(((G?G.lvl:1)-1)%6);
  if(!G){ctx.restore();return}
  const o=L();
  ctx.strokeStyle='rgba(255,90,110,.25)';ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(0,o.limit);ctx.lineTo(W,o.limit);ctx.stroke();ctx.setLineDash([]);
  drawBoss();
  G.words.forEach(drawWord);
  if(G.freeze>0){ctx.fillStyle='rgba(127,232,255,.08)';ctx.fillRect(0,0,W,H)}else if(G.burn>0){ctx.fillStyle='rgba(255,122,42,.08)';ctx.fillRect(0,0,W,H)}
  for(const s of G.shots){ctx.fillStyle=s.stage===1?'#b3a6ff':item('s').orb;ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(s.x,s.y,(4+s.len*.7)*S,0,6.283);ctx.fill();ctx.shadowBlur=0}
  for(const p of G.parts){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    if(p.txt){ctx.fillStyle=p.col;ctx.font='800 22px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y)}
    else{ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}
  }
  ctx.globalAlpha=1;
  drawMage();
  ctx.restore();
  // HUD
  const bw=W-24,pc=Math.max(0,G.bossHp/G.bossMax);
  ctx.fillStyle='#0c0a22';rr(12,10,bw,14,7);ctx.fill();
  ctx.fillStyle=pc>.3?'#ff7a45':'#ff5a6e';if(pc>0){rr(12,10,bw*pc,14,7);ctx.fill()}
  ctx.font='700 13px system-ui,sans-serif';ctx.textBaseline='top';ctx.textAlign='left';ctx.fillStyle='#cfc8f5';
  ctx.fillText(`${bl((G.lvl-1)%6)}: ${bn((G.lvl-1)%6)}, ${TX[lang].lv} ${G.lvl}`,12,30);
  ctx.textAlign='right';ctx.fillText(`${G.score}`+(G.combo>=3?`  x${Math.max(1,Math.floor(G.combo/3))}`:''),W-12,30);
  ctx.textAlign='left';ctx.fillStyle='#ff5a6e';ctx.font='700 14px system-ui,sans-serif';
  ctx.fillText('♥'.repeat(Math.max(0,G.lives))+(G.shield?'  🛡'+G.shield:''),12,H-24);
  if(G.banner>0){ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ffb347';ctx.font='800 28px system-ui,sans-serif';ctx.fillText(G.btxt,W/2,H*.4);ctx.font='600 15px system-ui,sans-serif';ctx.fillStyle='#cfc8f5';ctx.fillText(G.sub||'',W/2,H*.4+30);if(G.rwt){ctx.fillStyle='#ffd24a';ctx.fillText(G.rwt,W/2,H*.4+54)}if(G.abil){ctx.fillStyle='#ff9a5a';ctx.fillText('⚠ '+G.abil,W/2,H*.4+78)}}
  ctx.textBaseline='alphabetic';
}
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;CLK+=dt;
  if(st==='play'&&G)update(dt);
  draw();drawPV();drawKb(dt);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
