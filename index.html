<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Словомаг</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#120f2b;--panel:#1d1845;--rune:#8f7bff;--ember:#ffb347;--text:#f4f0ff;--bad:#ff5a6e;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;height:100%;padding-top:env(safe-area-inset-top,0)}
#stage{flex:1;min-height:0;position:relative}
canvas{display:block;width:100%;height:100%}
#bar{padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid #3a3190}
#inp{width:100%;font:700 19px ui-monospace,Menlo,Consolas,monospace;color:var(--text);background:#0c0a22;border:2px solid #3a3190;border-radius:12px;padding:11px 14px;outline:none;letter-spacing:.04em}
#inp:focus{border-color:var(--rune)}
#inp.err{border-color:var(--bad);animation:sh .25s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(14,11,36,.9)}
#ov.hide{display:none}
#ov h1{margin:0;font-size:34px;line-height:1.1;font-weight:800;color:var(--ember)}
#ov p{margin:0;max-width:300px;line-height:1.45;color:#cfc8f5}
#ov button{font:700 18px system-ui,sans-serif;color:#1a1033;background:var(--ember);border:0;border-radius:14px;padding:14px 34px;cursor:pointer}
#ov button:active{transform:scale(.97)}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="ov"><h1>Словомаг</h1><p>С неба падают слова. Печатай слово целиком — маг выстрелит и ударит босса. Чем длиннее слово, тем сильнее удар.</p><button id="go">Играть</button></div>
  </div>
  <div id="bar"><input id="inp" placeholder="печатай слово…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done"></div>
</div>
<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#120f2b');tg.setBackgroundColor('#120f2b');tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}}
const hap=t=>{try{tg&&tg.HapticFeedback.impactOccurred(t)}catch(e){}};
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),inp=$('inp'),ov=$('ov');

const S_W="кот дом лес сон мир суп нос чай мяч шар зуб лук рот бук удар огонь волк меч щит дым гром яд плащ".split(' ');
const M_W="магия дракон замок стрела молния корона ведьма клинок туман пламя камень ветер тень башня шипы руна посох зелье".split(' ');
const L_W="заклинание волшебник чудовище подземелье сокровище колдовство кристалл лабиринт хранитель сражение проклятие легенда победитель драконоборец".split(' ');
const BOSSES=["Гоблин","Скелет","Тролль","Лич","Дракон","Демон"];

let W=300,H=500,dpr=1,S=1,st='menu',G=null,last=0;
let best=0;try{best=+localStorage.getItem('slovomag_best')||0}catch(e){}
const stars=Array.from({length:45},()=>({u:Math.random(),v:Math.random(),r:Math.random()*1.4+.3,p:Math.random()*6}));

function rs(){const r=cv.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);cv.width=r.width*dpr;cv.height=r.height*dpr;W=r.width;H=r.height;ctx.setTransform(dpr,0,0,dpr,0,0);S=Math.max(.55,Math.min(1,H/520))}
new ResizeObserver(rs).observe(cv);rs();

const L=()=>({bossR:34*S,bossY:50+34*S+4,limit:H-8-72*S,orbX:W/2+22*S,orbY:H-8-64*S});

function newGame(){G={lvl:1,score:0,lives:5,combo:0,words:[],shots:[],parts:[],spawn:.4,t:0,flash:0,shake:0,banner:0,btxt:'',target:null,typed:''};initBoss()}
function initBoss(){G.bossMax=G.bossHp=60+G.lvl*50}

function pick(){
  const l=G.lvl,pS=Math.max(.6-.08*l,.1),pL=Math.min(.05+.07*l,.45),r=Math.random();
  const pool=r<pS?S_W:r<pS+(1-pS-pL)?M_W:L_W;
  return pool[Math.floor(Math.random()*pool.length)];
}
function spawnWord(){
  const used=new Set(G.words.map(w=>w.t[0]));let t;
  for(let i=0;i<14;i++){t=pick();if(!used.has(t[0])&&!G.words.some(w=>w.t===t))break}
  const o=L();
  G.words.push({t,u:Math.random(),y:o.bossY+o.bossR+10,sp:(34+G.lvl*5)*(1-t.length*.025)*S,locked:false});
}
function fs(){return Math.round(20*Math.max(S,.8))}
function wx(w){ctx.font=`700 ${fs()}px ui-monospace,Menlo,Consolas,monospace`;const tw=ctx.measureText(w.t).width+24;return{x:tw/2+8+w.u*Math.max(0,W-tw-16),tw}}

function boom(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*180;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6,max:.6,col,r:2+Math.random()*2.5})}}
function pop(x,y,txt,col){G.parts.push({x,y,vx:0,vy:-50,life:1,max:1,col,txt})}

function fire(w){
  w.locked=true;const o=L();
  G.shots.push({x:o.orbX,y:o.orbY,w,stage:1,len:w.t.length});
  inp.value='';G.target=null;G.typed='';hap('light');
}
function bossPos(){const o=L();return{x:W/2+Math.sin(G.t*.8)*W*.22,y:o.bossY}}

inp.addEventListener('input',()=>{
  if(st!=='play'||G.banner>0){inp.value='';return}
  const v=inp.value.trim().toLowerCase();G.typed=v;
  if(!v){G.target=null;return}
  const c=G.words.filter(w=>!w.locked&&w.t.startsWith(v));
  if(!c.length){inp.classList.add('err');setTimeout(()=>inp.classList.remove('err'),260);inp.value='';G.target=null;G.typed='';G.combo=0;hap('rigid');return}
  const ex=c.find(w=>w.t===v);
  if(ex){fire(ex);return}
  G.target=c.reduce((a,b)=>b.y>a.y?b:a);
});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){inp.value='';G&&(G.typed='',G.target=null)}});
window.addEventListener('keydown',()=>{if(st==='play'&&document.activeElement!==inp)inp.focus()});
cv.addEventListener('pointerdown',()=>{if(st==='play')inp.focus()});

function hitBoss(s){
  const n=s.len,dmg=Math.round(n*n/2*(1+Math.min(G.combo,10)*.05));
  G.combo++;G.bossHp-=dmg;G.score+=dmg*10*Math.max(1,Math.floor(G.combo/3));G.flash=.18;
  const b=bossPos();pop(b.x,b.y-20,'-'+dmg,'#ffb347');boom(b.x,b.y,'#ff7a45',10+n*2);hap(n>=7?'heavy':'medium');
  if(G.bossHp<=0){
    G.words.forEach(w=>{const p=wx(w);boom(p.x,w.y,'#8f7bff',8)});G.words=[];G.shots=[];
    G.score+=500*G.lvl;G.btxt='Босс повержен!';G.banner=2;G.lvl++;G.lives=Math.min(5,G.lives+1);initBoss();
    try{tg&&tg.HapticFeedback.notificationOccurred('success')}catch(e){}
  }
}

function update(dt){
  G.t+=dt;G.flash=Math.max(0,G.flash-dt);G.shake=Math.max(0,G.shake-dt);
  if(G.banner>0){G.banner-=dt}
  else{
    G.spawn-=dt;
    if(G.spawn<=0){spawnWord();G.spawn=Math.max(.9,2.5-G.lvl*.18)+Math.random()*.5}
  }
  const o=L();
  for(const w of G.words){
    if(w.locked)continue;
    w.y+=w.sp*dt;
    if(w.y>o.limit){
      w.dead=true;const p=wx(w);boom(p.x,o.limit,'#ff5a6e',14);
      G.lives--;G.combo=0;G.shake=.3;hap('rigid');
      if(G.target===w){G.target=null;G.typed='';inp.value=''}
    }
  }
  G.words=G.words.filter(w=>!w.dead);
  for(const s of G.shots){
    let tx,ty;
    if(s.stage===1){const p=wx(s.w);tx=p.x;ty=s.w.y}else{const b=bossPos();tx=b.x;ty=b.y}
    const dx=tx-s.x,dy=ty-s.y,d=Math.hypot(dx,dy),sp=(s.stage===1?1100:900)*dt;
    if(d<=sp+8){
      if(s.stage===1){boom(tx,ty,'#ffd24a',12+s.len*2);G.words=G.words.filter(w=>w!==s.w);s.stage=2}
      else{s.done=true;hitBoss(s)}
    }else{s.x+=dx/d*sp;s.y+=dy/d*sp}
    G.parts.push({x:s.x,y:s.y,vx:0,vy:0,life:.25,max:.25,col:s.stage===1?'#8f7bff':'#ffb347',r:2+s.len*.4});
  }
  G.shots=G.shots.filter(s=>!s.done);
  for(const p of G.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
  G.parts=G.parts.filter(p=>p.life>0);
  if(G.lives<=0)gameOver();
}

function gameOver(){
  st='over';inp.blur();
  if(G.score>best){best=G.score;try{localStorage.setItem('slovomag_best',best)}catch(e){}}
  ov.innerHTML=`<h1>Поражение</h1><p>Счёт: <b>${G.score}</b><br>Рекорд: <b>${best}</b><br>Дошёл до уровня ${G.lvl}</p><button id="go">Ещё раз</button>`;
  ov.classList.remove('hide');$('go').onclick=start;
  try{tg&&tg.HapticFeedback.notificationOccurred('error')}catch(e){}
}
function start(){newGame();st='play';ov.classList.add('hide');inp.value='';inp.focus()}
$('go').onclick=start;

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function drawBoss(){
  const o=L(),b=bossPos(),r=o.bossR,hue=(G.lvl*50)%360;
  ctx.save();ctx.translate(b.x,b.y+Math.sin(G.t*2)*3);
  ctx.fillStyle=G.flash>0?'#fff':`hsl(${hue} 55% 42%)`;
  ctx.beginPath();ctx.moveTo(-r*.8,-r*.4);ctx.lineTo(-r*1.1,-r*1.3);ctx.lineTo(-r*.3,-r*.8);ctx.fill();
  ctx.beginPath();ctx.moveTo(r*.8,-r*.4);ctx.lineTo(r*1.1,-r*1.3);ctx.lineTo(r*.3,-r*.8);ctx.fill();
  ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.fill();
  ctx.fillStyle='#ffe27a';
  for(const sx of[-1,1]){ctx.beginPath();ctx.ellipse(sx*r*.38,-r*.1,r*.2,r*.13,sx*.4,0,6.283);ctx.fill()}
  ctx.fillStyle='#1a0d2e';rr(-r*.5,r*.25,r,r*.3,r*.1);ctx.fill();
  ctx.fillStyle='#fff';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*r*.18-r*.07,r*.25);ctx.lineTo(i*r*.18+r*.07,r*.25);ctx.lineTo(i*r*.18,r*.4);ctx.fill()}
  ctx.restore();
}
function drawMage(){
  const o=L();ctx.save();ctx.translate(W/2,H-8);ctx.scale(S,S);
  ctx.fillStyle='#5a3fd0';ctx.beginPath();ctx.moveTo(-20,0);ctx.lineTo(20,0);ctx.lineTo(9,-34);ctx.lineTo(-9,-34);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-42,8,0,6.283);ctx.fill();
  ctx.fillStyle='#3a2a9e';ctx.beginPath();ctx.moveTo(-15,-46);ctx.lineTo(0,-76);ctx.lineTo(15,-46);ctx.fill();
  ctx.fillRect(-17,-48,34,4);
  ctx.strokeStyle='#8a5a2b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(22,-60);ctx.stroke();
  ctx.restore();
  ctx.fillStyle=G&&G.target?'#ffd24a':'#ffb347';ctx.shadowColor='#ffb347';ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(o.orbX,o.orbY,6*S,0,6.283);ctx.fill();ctx.shadowBlur=0;
}
function drawWord(w){
  const p=wx(w),o=L(),h=fs()+14,x=p.x-p.tw/2,y=w.y-h/2;
  const danger=w.y>o.limit-70*S,isT=G.target===w;
  ctx.fillStyle='rgba(29,24,69,.94)';rr(x,y,p.tw,h,9);ctx.fill();
  ctx.lineWidth=isT?3:2;ctx.strokeStyle=isT?'#ffd24a':danger?'#ff5a6e':'#6a58e0';ctx.stroke();
  ctx.font=`700 ${fs()}px ui-monospace,Menlo,Consolas,monospace`;ctx.textBaseline='middle';ctx.textAlign='left';
  const n=isT?G.typed.length:0,a=w.t.slice(0,n),b=w.t.slice(n),tx=x+12;
  ctx.fillStyle='#ffd24a';ctx.fillText(a,tx,w.y+1);
  ctx.fillStyle='#f4f0ff';ctx.fillText(b,tx+ctx.measureText(a).width,w.y+1);
}
function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#120f2b');g.addColorStop(1,'#2a1a5e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(!G){return}
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  for(const s of stars){ctx.globalAlpha=.4+.4*Math.sin(G.t*2+s.p);ctx.fillStyle='#fff';ctx.fillRect(s.u*W,s.v*H,s.r,s.r)}
  ctx.globalAlpha=1;
  const o=L();
  ctx.strokeStyle='rgba(255,90,110,.25)';ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(0,o.limit);ctx.lineTo(W,o.limit);ctx.stroke();ctx.setLineDash([]);
  drawBoss();
  G.words.forEach(drawWord);
  for(const s of G.shots){ctx.fillStyle=s.stage===1?'#b3a6ff':'#ffb347';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(s.x,s.y,(4+s.len*.7)*S,0,6.283);ctx.fill();ctx.shadowBlur=0}
  for(const p of G.parts){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    if(p.txt){ctx.fillStyle=p.col;ctx.font='800 22px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y)}
    else{ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}
  }
  ctx.globalAlpha=1;
  drawMage();
  ctx.restore();
  // HUD
  const bw=W-24,pc=Math.max(0,G.bossHp/G.bossMax);
  ctx.fillStyle='#0c0a22';rr(12,10,bw,14,7);ctx.fill();
  ctx.fillStyle=pc>.3?'#ff7a45':'#ff5a6e';if(pc>0){rr(12,10,bw*pc,14,7);ctx.fill()}
  ctx.font='700 13px system-ui,sans-serif';ctx.textBaseline='top';ctx.textAlign='left';ctx.fillStyle='#cfc8f5';
  ctx.fillText(`${BOSSES[(G.lvl-1)%BOSSES.length]}, ур. ${G.lvl}`,12,30);
  ctx.textAlign='right';ctx.fillText(`${G.score}`+(G.combo>=3?`  x${Math.max(1,Math.floor(G.combo/3))}`:''),W-12,30);
  ctx.textAlign='left';ctx.fillStyle='#ff5a6e';ctx.font='700 14px system-ui,sans-serif';
  ctx.fillText('♥'.repeat(Math.max(0,G.lives)),12,H-24);
  if(G.banner>0){ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ffb347';ctx.font='800 28px system-ui,sans-serif';ctx.fillText(G.btxt,W/2,H*.4);ctx.font='600 15px system-ui,sans-serif';ctx.fillStyle='#cfc8f5';ctx.fillText('Следующий босс приближается…',W/2,H*.4+30)}
  ctx.textBaseline='alphabetic';
}
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(st==='play'&&G)update(dt);
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
