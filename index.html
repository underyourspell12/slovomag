function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,ty,v,sl,dl){if(!sfxOn)return;const a=ac();if(!a)return;const t=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v,fq,dl){if(!sfxOn)return;const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fq;g.gain.value=v;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+(dl||0))}

function figure(c,cx,by,sc,hl,t){
  const Hh=item('h'),Cc=item('c'),Ss=item('s');
  c.save();c.translate(cx,by);c.scale(sc,sc);
  c.fillStyle=Cc.a;c.beginPath();c.moveTo(-22,0);c.lineTo(22,0);c.lineTo(10,-34);c.lineTo(-10,-34);c.fill();
  c.fillStyle='rgba(0,0,0,.18)';c.fillRect(-2,-30,4,30);
  if(Cc.k===1){c.fillStyle=Cc.b;c.fillRect(-22,-4,44,4)}
  if(Cc.k===2){c.fillStyle=Cc.b;[[-9,-8],[7,-14],[-3,-22],[11,-5],[-14,-4],[2,-8]].forEach(q=>{c.beginPath();c.arc(q[0],q[1],1.7,0,6.283);c.fill()})}
  c.fillStyle=Cc.b;c.beginPath();c.arc(0,-32,2.6,0,6.283);c.fill();
  c.fillStyle='#f0c9a0';c.beginPath();c.arc(0,-42,8,0,6.283);c.fill();
  c.fillStyle=Hh.a;
  if(Hh.k==='crown'){c.fillRect(-9,-54,18,8);for(const x of[-9,0,9]){c.beginPath();c.moveTo(x-4,-54);c.lineTo(x,-63);c.lineTo(x+4,-54);c.fill()}c.fillStyle='#e8453c';c.beginPath();c.arc(0,-50,2,0,6.283);c.fill()}
  else if(Hh.k==='witch'){c.beginPath();c.ellipse(0,-47,22,4,0,0,6.283);c.fill();c.beginPath();c.moveTo(-10,-47);c.lineTo(3,-77);c.lineTo(10,-47);c.fill();c.fillStyle=Hh.b;c.fillRect(-10,-53,20,3)}
  else{c.beginPath();c.moveTo(-15,-46);c.lineTo(0,-76);c.lineTo(15,-46);c.fill();c.fillRect(-17,-48,34,4);c.fillStyle='#ffd24a';c.fillRect(-14,-52,28,2.5);if(Hh.k==='star'){c.beginPath();c.arc(0,-77,3.5,0,6.283);c.fill()}}
  c.strokeStyle=Ss.pole;c.lineWidth=3;c.beginPath();c.moveTo(22,2);c.lineTo(22,-60);c.stroke();
  c.fillStyle=hl?'#ffd24a':Ss.orb;c.shadowColor=Ss.glow;c.shadowBlur=14;c.beginPath();
  if(Ss.k==='dia'){c.moveTo(22,-73);c.lineTo(28,-64);c.lineTo(22,-55);c.lineTo(16,-64)}else c.arc(22,-64,6,0,6.283);
  c.fill();c.shadowBlur=0;c.restore();
}
function drawPV(){

  const d=Math.min(devicePixelRatio||1,2);if(e.width!==Math.round(w*d)){e.width=Math.round(w*d);e.height=Math.round(h*d)}
  const c=e.getContext('2d'),sc=Math.min(w/62,h/92);c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);
  const g=c.createRadialGradient(w/2,h*.6,5,w/2,h*.6,w*.6);g.addColorStop(0,'rgba(143,123,255,.35)');g.addColorStop(1,'rgba(143,123,255,0)');c.fillStyle=g;c.fillRect(0,0,w,h);

function update(dt){
  G.t+=dt;G.flash=Math.max(0,G.flash-dt);G.shake=Math.max(0,G.shake-dt);
  if(G.banner>0){G.banner-=dt}
  else{
    G.spawn-=dt;
    if(G.spawn<=0){spawnWord();G.spawn=Math.max(.9,2.5-G.lvl*.18)+Math.random()*.5}
  }
  const o=L();
  for(const w of G.words){
    if(w.locked)continue;
    w.y+=w.sp*dt;
    if(w.y>o.limit){
      w.dead=true;const p=wx(w);boom(p.x,o.limit,'#ff5a6e',14);
      G.lives--;G.combo=0;G.shake=.3;SFX.life();hap('rigid');
      if(G.target===w){G.target=null;G.typed='';inp.value=''}
    }
  }
  G.words=G.words.filter(w=>!w.dead);
  for(const s of G.shots){
    let tx,ty;
    if(s.stage===1){const p=wx(s.w);tx=p.x;ty=s.w.y}else{const b=bossPos();tx=b.x;ty=b.y}
    const dx=tx-s.x,dy=ty-s.y,d=Math.hypot(dx,dy),sp=(s.stage===1?1100:900)*dt;
    if(d<=sp+8){
      if(s.stage===1){SFX.word(s.len);boom(tx,ty,'#ffd24a',12+s.len*2);G.words=G.words.filter(w=>w!==s.w);s.stage=2}
      else{s.done=true;hitBoss(s)}

    G.parts.push({x:s.x,y:s.y,vx:0,vy:0,life:.25,max:.25,col:s.stage===1?'#8f7bff':item('s').orb,r:2+s.len*.4});
  }
  G.shots=G.shots.filter(s=>!s.done);
  for(const p of G.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
  G.parts=G.parts.filter(p=>p.life>0);
  if(G.lives<=0)gameOver();
}

  drawBoss();
  G.words.forEach(drawWord);
  for(const s of G.shots){ctx.fillStyle=s.stage===1?'#b3a6ff':item('s').orb;ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(s.x,s.y,(4+s.len*.7)*S,0,6.283);ctx.fill();ctx.shadowBlur=0}
  for(const p of G.parts){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    if(p.txt){ctx.fillStyle=p.col;ctx.font='800 22px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y)}
    else{ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}
  }
  ctx.globalAlpha=1;
  drawMage();
  ctx.restore();
  // HUD
  const bw=W-24,pc=Math.max(0,G.bossHp/G.bossMax);
  ctx.fillStyle='#0c0a22';rr(12,10,bw,14,7);ctx.fill();
  ctx.fillStyle=pc>.3?'#ff7a45':'#ff5a6e';if(pc>0){rr(12,10,bw*pc,14,7);ctx.fill()}
  ctx.font='700 13px system-ui,sans-serif';ctx.textBaseline='top';ctx.textAlign='left';ctx.fillStyle='#cfc8f5';
  ctx.fillText(`${bl((G.lvl-1)%6)}: ${bn((G.lvl-1)%6)}, ${TX[lang].lv} ${G.lvl}`,12,30);
  ctx.textAlign='right';ctx.fillText(`${G.score}`+(G.combo>=3?`  x${Math.max(1,Math.floor(G.combo/3))}`:''),W-12,30);
  ctx.textAlign='left';ctx.fillStyle='#ff5a6e';ctx.font='700 14px system-ui,sans-serif';
  ctx.fillText('♥'.repeat(Math.max(0,G.lives)),12,H-24);
  if(G.banner>0){ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ffb347';ctx.font='800 28px system-ui,sans-serif';ctx.fillText(G.btxt,W/2,H*.4);ctx.font='600 15px system-ui,sans-serif';ctx.fillStyle='#cfc8f5';ctx.fillText(G.sub||'',W/2,H*.4+30);if(G.rwt){ctx.fillStyle='#ffd24a';ctx.fillText(G.rwt,W/2,H*.4+54)}}
  ctx.textBaseline='alphabetic';
}
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;CLK+=dt;
  if(st==='play'&&G)update(dt);
  draw();drawPV();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
